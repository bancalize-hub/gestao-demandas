# /etc/nginx/sites-available/gestao-api
# Substitua api.SEU-DOMINIO.com pelo seu subdomínio da API.
server {
    listen 80;
    server_name api.SEU-DOMINIO.com;
    root /var/www/gestao/api/public;

    index index.php;
    charset utf-8;
    client_max_body_size 60M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
