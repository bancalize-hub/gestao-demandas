# vhost EXCLUSIVO para demandas.bancalize.com.br (front Nuxt SSR)
# Reverse-proxy para o pm2 em 127.0.0.1:3000. TLS via Cloudflare Origin Certificate.

server {
    listen 80;
    listen [::]:80;
    server_name demandas.bancalize.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demandas.bancalize.com.br;

    ssl_certificate     /etc/nginx/ssl/demandas.bancalize.com.br/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/demandas.bancalize.com.br/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_gestao_web:10m;
    ssl_session_timeout 1d;

    client_max_body_size 60M;

    access_log /var/log/nginx/gestao-web.access.log;
    error_log  /var/log/nginx/gestao-web.error.log;

    # Avatares desenhados (DiceBear) — a seed identifica o desenho, então o conteúdo
    # nunca muda para a mesma URL. Cache longo: são ~10 KB cada e a lista abre com
    # centenas de contatos. Sem este bloco eles cairiam no no-store do `location /`
    # e seriam rebaixados a cada abertura da tela.
    location /_avatares/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Assets com hash no nome (_nuxt) — cache longo e imutável (o nome muda a cada build).
    # Servidos DO DISCO: o deploy mantém os pedaços da versão anterior junto dos novos, e
    # quem estava com o CRM aberto durante a publicação continua achando o arquivo que
    # pediu (o servidor do Nuxt só conhece os do build atual e dava 404 — 26/11).
    location /_nuxt/ {
        root /var/www/gestao/web/.output/public;
        try_files $uri @nuxt_assets;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location @nuxt_assets {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # O HTML (shell do SPA) NUNCA pode ser cacheado — senão, após um deploy, o navegador/
        # Cloudflare servem o index antigo que aponta para um chunk _nuxt que não existe mais
        # (tela em branco / "não carrega"). Assets têm hash, então o HTML novo já traz os certos.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
